<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Artemis Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Wiki oficial de Artemis">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5865F2;
    }
    body {
      background-color: #1e1f22;
      color: #e0e2e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .sidebar {
      background-color: #141517;
      color: #b5bac1;
      border-right: 1px solid #2b2d31;
    }
    .sidebar-nav strong {
      color: #949ba4;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .sidebar-nav a {
      color: #dbdee1;
      font-size: 0.95rem;
      transition: color 0.15s ease;
    }
    .sidebar-nav a:hover {
      color: #5865F2;
    }
    .sidebar-nav li.active > a {
      color: #5865F2;
      font-weight: 600;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      color: #f2f3f5;
    }
    .markdown-section hr {
      border: none;
      border-top: 1px solid #2e3035;
      margin: 2em 0;
    }
    .markdown-section table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      background-color: #2b2d31;
      border-radius: 6px;
      overflow: hidden;
    }
    .markdown-section table th {
      background-color: #232428;
      color: #f2f3f5;
      font-weight: bold;
      border: 1px solid #35373c;
      padding: 10px 14px;
      text-align: left;
    }
    .markdown-section table td {
      border: 1px solid #35373c;
      padding: 10px 14px;
      color: #dbdee1;
    }
    .markdown-section tr:nth-child(2n) {
      background-color: #26282c;
    }
    .markdown-section tr:hover {
      background-color: #313338;
    }
    .markdown-section code {
      background-color: #2b2d31;
      color: #00d26a;
      border-radius: 4px;
      padding: 2px 6px;
    }
    .search input {
      background-color: #2b2d31 !important;
      color: #ffffff !important;
      border: 1px solid #35373c !important;
      border-radius: 6px;
    }
    .search input::placeholder {
      color: #949ba4;
    }
    .markdown-section blockquote {
      border-left: 4px solid #5865F2;
      background-color: #232428;
      color: #dbdee1;
      padding: 12px 18px;
      margin: 1.5em 0;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Artemis Wiki...</div>
  <script>
    window.$docsify = {
      name: '🌙 Artemis Wiki',
      repo: 'https://github.com/dnkjs/Artemis-Wiki',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 0,
      maxLevel: 3,
      homepage: 'presentacion.md',
      auto2top: true,
      search: {
        placeholder: 'Buscar en la wiki...',
        noData: 'Sin resultados',
        depth: 3
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
