<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>⚔️ Artemis Dofus 2.51 — Enciclopedia & Guía Oficial</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Enciclopedia y Guía Oficial de Artemis Dofus 2.51 Fun Cheto Duo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Favicon with the Crystal Dofus Egg -->
  <link rel="icon" type="image/jpeg" href=".gitbook/assets/artemis_dofus_egg.jpg">
  
  <!-- Google Fonts: Cinzel (Fantasy RPG), Rajdhani (Gaming HUD), Inter (Crisp text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Docsify Theme Base & Plugins -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">

  <style>
    /* =========================================================
       ARTEMIS DOFUS 2.51 — CELESTIAL CRYSTAL BLUE GAMING HUD
       ========================================================= */
    :root {
      --artemis-cyan: #00e5ff;
      --artemis-blue: #38bdf8;
      --artemis-blue-dark: #0284c7;
      --artemis-glow: rgba(0, 229, 255, 0.4);
      --artemis-glow-subtle: rgba(56, 189, 248, 0.15);
      
      --artemis-silver: #cbd5e1;
      --artemis-silver-bright: #f8fafc;
      
      --artemis-bg-deep: #07090e;
      --artemis-bg-main: #0c101a;
      --artemis-bg-panel: #111726;
      --artemis-bg-card: #151d30;
      
      --artemis-border: rgba(56, 189, 248, 0.25);
      --artemis-border-glow: rgba(0, 229, 255, 0.5);
      
      --artemis-text: #e2e8f0;
      --artemis-text-muted: #94a3b8;
      --theme-color: #00e5ff;
    }

    * {
      box-sizing: border-box;
    }

    /* Custom Celestial Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #07090e;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border-radius: 4px;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    body {
      background-color: var(--artemis-bg-deep);
      background-image: 
        radial-gradient(ellipse at 15% 10%, rgba(0, 162, 255, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 85%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #07090e 0%, #0d121e 100%);
      color: var(--artemis-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.7;
    }

    /* ---------------------------------------------------------
       SIDEBAR / HUD NAVIGATION
       --------------------------------------------------------- */
    .sidebar {
      background: linear-gradient(180deg, #0a0e18 0%, #06080e 100%);
      border-right: 1px solid var(--artemis-border);
      box-shadow: 4px 0 30px rgba(0, 0, 0, 0.8);
      color: var(--artemis-text-muted);
      padding-top: 15px;
    }

    /* Brand Logo / Avatar in Sidebar */
    .sidebar .app-name {
      margin-bottom: 20px;
    }
    .sidebar .app-name::before {
      content: "";
      display: block;
      width: 84px;
      height: 84px;
      margin: 10px auto 14px auto;
      background: url('.gitbook/assets/artemis_dofus_egg.jpg') no-repeat center center;
      background-size: cover;
      border-radius: 50%;
      border: 2px solid var(--artemis-cyan);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.5), inset 0 0 12px rgba(0, 229, 255, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .sidebar .app-name:hover::before {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.8), inset 0 0 18px rgba(0, 229, 255, 0.6);
    }

    .sidebar .app-name-link {
      font-family: 'Cinzel', serif !important;
      font-size: 1.35rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.1em;
      color: #ffffff !important;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(0, 229, 255, 0.7), 0 2px 4px #000;
      display: block;
      text-align: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--artemis-border);
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.1), transparent);
    }
    .sidebar .app-name-link::after {
      content: "✦ SERVIDOR FUN DUO 2.51 ✦";
      display: block;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.22em;
      color: var(--artemis-blue);
      margin-top: 4px;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    /* Search Box */
    .search {
      padding: 12px 16px !important;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
    }
    .search input {
      background: #0f1524 !important;
      color: #ffffff !important;
      border: 1px solid #1e293b !important;
      border-radius: 6px !important;
      padding: 9px 14px !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.88rem !important;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
      transition: all 0.25s ease;
    }
    .search input:focus {
      border-color: var(--artemis-cyan) !important;
      box-shadow: 0 0 14px var(--artemis-glow), inset 0 2px 4px rgba(0,0,0,0.6) !important;
    }
    .search input::placeholder {
      color: #64748b;
    }

    /* Sidebar Navigation Items */
    .sidebar-nav {
      padding: 10px 14px 40px 14px;
    }
    .sidebar-nav > ul > li {
      margin: 8px 0;
    }
    .sidebar-nav strong {
      display: block;
      font-family: 'Cinzel', serif;
      color: #7dd3fc;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      margin: 18px 0 8px 6px;
      text-transform: uppercase;
      border-left: 2px solid var(--artemis-cyan);
      padding-left: 8px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }
    .sidebar-nav a {
      color: #94a3b8;
      font-size: 0.92rem;
      padding: 7px 10px;
      border-radius: 5px;
      transition: all 0.18s ease;
      display: block;
    }
    .sidebar-nav a:hover {
      color: #ffffff;
      background: rgba(0, 229, 255, 0.1);
      transform: translateX(4px);
    }
    .sidebar-nav li.active > a {
      color: #ffffff !important;
      font-weight: 700;
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.22) 0%, rgba(0, 229, 255, 0.02) 100%) !important;
      border-left: 3px solid var(--artemis-cyan);
      padding-left: 12px;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
    }

    /* ---------------------------------------------------------
       MAIN CONTENT AREA
       --------------------------------------------------------- */
    .content {
      padding-top: 25px;
    }
    .markdown-section {
      max-width: 920px;
      padding: 30px 45px 80px 45px;
    }

    /* Headings */
    .markdown-section h1 {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 2.3rem;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(0, 229, 255, 0.5), 0 2px 6px #000;
      letter-spacing: 0.04em;
      border-bottom: 2px solid var(--artemis-border-glow);
      padding-bottom: 14px;
      margin-top: 15px;
      margin-bottom: 25px;
      position: relative;
    }
    .markdown-section h1::after {
      content: "✦";
      position: absolute;
      right: 0;
      bottom: -11px;
      color: var(--artemis-cyan);
      background: var(--artemis-bg-deep);
      padding: 0 8px;
      font-size: 1rem;
      text-shadow: 0 0 10px var(--artemis-cyan);
    }

    .markdown-section h2 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: #bae6fd;
      margin-top: 35px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      padding-bottom: 8px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .markdown-section h3 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--artemis-cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 28px;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }

    .markdown-section h4 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: #7dd3fc;
      margin-top: 20px;
    }

    /* Paragraphs & Links */
    .markdown-section p, .markdown-section li {
      color: #cbd5e1;
      font-size: 0.98rem;
    }
    .markdown-section strong {
      color: #ffffff;
      font-weight: 600;
    }
    .markdown-section a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dotted rgba(56, 189, 248, 0.6);
      transition: all 0.18s ease;
    }
    .markdown-section a:hover {
      color: #ffffff;
      border-bottom: 1px solid var(--artemis-cyan);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
    }

    /* Dividers */
    .markdown-section hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.4), transparent);
      margin: 35px 0;
    }

    /* ---------------------------------------------------------
       DOFUS QUEST BOXES & CALLOUTS (Blockquotes)
       --------------------------------------------------------- */
    .markdown-section blockquote {
      background: linear-gradient(135deg, rgba(14, 30, 56, 0.7) 0%, rgba(9, 14, 25, 0.85) 100%);
      border-left: 4px solid var(--artemis-cyan);
      border-top: 1px solid rgba(56, 189, 248, 0.2);
      border-right: 1px solid rgba(56, 189, 248, 0.15);
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 0 8px 8px 0;
      padding: 16px 22px;
      margin: 22px 0;
      color: #f1f5f9;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 229, 255, 0.05);
    }
    .markdown-section blockquote p {
      margin: 0;
      font-size: 0.96rem;
    }

    /* ---------------------------------------------------------
       CRYSTAL STAT TABLES
       --------------------------------------------------------- */
    .markdown-section table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 24px 0;
      background: var(--artemis-bg-card);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6), inset 0 0 25px rgba(0, 0, 0, 0.4);
    }
    .markdown-section table th {
      background: linear-gradient(180deg, #13243d 0%, #0d1727 100%);
      color: #7dd3fc;
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 13px 18px;
      border-bottom: 2px solid var(--artemis-cyan);
      border-right: 1px solid rgba(56, 189, 248, 0.15);
      text-align: left;
      text-shadow: 0 1px 4px #000;
    }
    .markdown-section table th:last-child {
      border-right: none;
    }
    .markdown-section table td {
      padding: 13px 18px;
      border-bottom: 1px solid #1e293b;
      border-right: 1px solid #162032;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    .markdown-section table td:last-child {
      border-right: none;
    }
    .markdown-section table tr:last-child td {
      border-bottom: none;
    }
    .markdown-section table tr:nth-child(even) {
      background: rgba(13, 20, 34, 0.7);
    }
    .markdown-section table tr:hover {
      background: rgba(0, 229, 255, 0.08);
    }

    /* Code & In-Game Command Styling */
    .markdown-section code {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.88rem;
    }
    .markdown-section pre[data-lang] {
      background: #0a0f1d !important;
      border: 1px solid #1e293b !important;
      border-radius: 8px !important;
      box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    }

    /* ---------------------------------------------------------
       SIDEBAR ACCORDION / COLLAPSIBLE CATEGORIES (GITBOOK STYLE)
       --------------------------------------------------------- */
    /* Remove default left arrow from sidebar-collapse */
    .sidebar-nav ul:not(.app-sub-sidebar) > li:not(.file)::before {
      display: none !important;
    }

    /* Folders have a sleek right-side arrow */
    .sidebar-nav li.folder > a,
    .sidebar-nav li.folder > strong {
      position: relative;
      padding-right: 30px !important;
      cursor: pointer;
    }
    .sidebar-nav li.folder > a::after,
    .sidebar-nav li.folder > strong::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 2px solid var(--artemis-cyan);
      border-bottom: 2px solid var(--artemis-cyan);
      transform: translateY(-50%) rotate(-45deg);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease;
      opacity: 0.8;
    }
    .sidebar-nav li.folder:hover > a::after,
    .sidebar-nav li.folder:hover > strong::after {
      opacity: 1;
      border-color: #ffffff;
      box-shadow: 1px 1px 6px rgba(0, 229, 255, 0.6);
    }
    .sidebar-nav li.folder.open > a::after,
    .sidebar-nav li.folder.open > strong::after {
      transform: translateY(-50%) rotate(45deg);
    }
    .sidebar-nav li.folder.collapse > a::after,
    .sidebar-nav li.folder.collapse > strong::after {
      transform: translateY(-50%) rotate(-45deg);
    }

    /* Sub-menus nesting & indentation */
    .sidebar-nav li.folder > ul {
      padding-left: 10px !important;
      margin: 4px 0 8px 6px !important;
      border-left: 1px dashed rgba(56, 189, 248, 0.25);
    }
    .sidebar-nav li.file a {
      font-size: 0.88rem !important;
      padding: 6px 10px !important;
      color: #94a3b8 !important;
      border-radius: 4px;
    }
    .sidebar-nav li.file a:hover {
      color: #ffffff !important;
      background: rgba(0, 229, 255, 0.1) !important;
      transform: translateX(4px);
    }

    /* Images & Emoji Fix */
    .markdown-section img.emoji {
      display: inline-block !important;
      vertical-align: -0.22em !important;
      width: 1.25em !important;
      height: 1.25em !important;
      min-width: 1.25em !important;
      min-height: 1.25em !important;
      margin: 0 4px !important;
      padding: 0 !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: transparent !important;
    }
    .markdown-section img:not(.emoji) {
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 8px 30px rgba(0, 162, 255, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 22px auto;
    }
    .markdown-section img:not(.emoji):hover {
      transform: scale(1.015);
      box-shadow: 0 10px 40px rgba(0, 229, 255, 0.4);
    }

    /* ---------------------------------------------------------
       RPG CATEGORY HUB GRID & CARDS
       --------------------------------------------------------- */
    .rpg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
      margin: 28px 0 40px 0;
    }
    .rpg-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(145deg, #0e1524 0%, #080c16 100%);
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 10px;
      padding: 20px 22px;
      text-decoration: none !important;
      color: var(--artemis-text) !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    .rpg-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--artemis-cyan), transparent);
      opacity: 0.4;
      transition: opacity 0.25s ease;
    }
    .rpg-card:hover {
      transform: translateY(-4px);
      border-color: var(--artemis-cyan);
      box-shadow: 0 10px 32px rgba(0, 229, 255, 0.25), 0 0 16px rgba(0, 229, 255, 0.15);
      background: linear-gradient(145deg, #121c2e 0%, #0b111e 100%);
    }
    .rpg-card:hover::before {
      opacity: 1;
    }
    .rpg-card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--artemis-cyan);
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 4px;
      padding: 3px 8px;
      margin-bottom: 12px;
    }
    .rpg-card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rpg-card-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .rpg-card-action {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--artemis-blue);
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      transition: gap 0.2s ease, color 0.2s ease;
      border-top: 1px solid rgba(56, 189, 248, 0.12);
      padding-top: 10px;
    }
    .rpg-card:hover .rpg-card-action {
      color: var(--artemis-cyan);
      gap: 10px;
    }

    /* ---------------------------------------------------------
       RPG RELIC SHOWCASE BOX
       --------------------------------------------------------- */
    .relic-box {
      background: linear-gradient(145deg, #0f1627 0%, #080c14 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 24px;
      margin: 28px 0;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 229, 255, 0.03);
    }
    .relic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .relic-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .relic-icon-pill {
      font-size: 1.6rem;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--artemis-cyan);
      border-radius: 8px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
    }
    .relic-name {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
    }
    .relic-tag {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #7dd3fc;
    }
    .relic-stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }
    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #111a2e;
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.92rem;
      color: #e2e8f0;
    }
    .stat-badge strong {
      color: var(--artemis-cyan);
    }

    /* In-game Commands Callout */
    .cmd-box {
      background: linear-gradient(135deg, #0c1424 0%, #060a12 100%);
      border: 1px solid var(--artemis-cyan);
      border-radius: 8px;
      padding: 18px 22px;
      margin: 20px 0;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }
    .cmd-name {
      font-family: 'Rajdhani', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--artemis-cyan);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      margin-bottom: 6px;
    }

    /* Lists */
    .markdown-section ul {
      padding-left: 22px;
    }
    .markdown-section li {
      margin: 6px 0;
    }
    .markdown-section li::marker {
      color: var(--artemis-cyan);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 20px 60px 20px;
      }
      .markdown-section h1 {
        font-size: 1.8rem;
      }
    }
  </style>
